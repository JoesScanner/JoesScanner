name: WordPress plugin integration

on:
  push:
    branches:
      - codex/mobile-audio-improvements

permissions:
  contents: read

jobs:
  integration:
    name: WordPress directory and Favorites integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read the pinned SDK version
        id: sdk
        run: |
          version="$(python -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Check hosted runner tooling
        run: |
          docker version
          docker compose version
          dotnet --version

      - name: Run the disposable WordPress integration suite
        timeout-minutes: 16
        run: python tests/WordPressFavorites.Integration/run.py
