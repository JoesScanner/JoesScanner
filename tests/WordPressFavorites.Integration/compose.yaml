services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: integration
      MARIADB_PASSWORD: ${JS_FAVORITES_DB_PASSWORD:?Run the integration runner}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/mysql
    networks: [backend]

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: integration
      WORDPRESS_DB_PASSWORD: ${JS_FAVORITES_DB_PASSWORD:?Run the integration runner}
      WORDPRESS_TABLE_PREFIX: jsfav_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'JOES_SCANNER_FAVORITES_INTEGRATION', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_HTTP_BLOCK_EXTERNAL', true );
        define( 'DISABLE_WP_CRON', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', '/tmp/js-favorites-integration.log' );
    volumes:
      - wordpress:/var/www/html
      - ../../JoesScanner/API_Plugin/joes-scanner-auth:/var/www/html/wp-content/plugins/joes-scanner-auth:ro
      - ./fixtures.php:/fixtures.php:ro
      - ./wordpress.conf:/etc/apache2/conf-enabled/js-favorites-integration.conf:ro
    networks: [backend]

  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: integration
      WORDPRESS_DB_PASSWORD: ${JS_FAVORITES_DB_PASSWORD:?Run the integration runner}
      WORDPRESS_TABLE_PREFIX: jsfav_
      WORDPRESS_CONFIG_EXTRA: |
        define( 'JOES_SCANNER_FAVORITES_INTEGRATION', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_HTTP_BLOCK_EXTERNAL', true );
        define( 'DISABLE_WP_CRON', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - wordpress:/var/www/html
      - ../../JoesScanner/API_Plugin/joes-scanner-auth:/var/www/html/wp-content/plugins/joes-scanner-auth:ro
      - ./fixtures.php:/fixtures.php:ro
    networks: [backend]

  tls:
    image: caddy:2-alpine
    depends_on: [wordpress]
    ports:
      - "127.0.0.1:${JS_FAVORITES_HTTPS_PORT:-18443}:443"
      - "127.0.0.1:${JS_FAVORITES_HTTP_PORT:-18080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    networks: [backend, ingress]

networks:
  backend:
    internal: true
  ingress:

volumes:
  database:
  wordpress:
  certificates:
